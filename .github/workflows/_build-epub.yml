name: _build-epub

# Reusable workflow. Called once per article count from build.yml. Builds
# BOTH the text and images EPUB back-to-back in the same job so:
#
#   * the summaries.sqlite that text just populated is reused in-process
#     by the images step (no cache round-trip needed);
#   * only ONE cache save happens per size, eliminating the parallel-save
#     race we'd get if text and images were separate jobs.
#
# Sizes are chained largest -> smallest in build.yml, and share a single
# cache key per language. 10k's cache is a strict superset of 5k's and
# 1k's (same seed, same lang), so 5k and 1k are near-instant restores.

on:
  workflow_call:
    inputs:
      label:
        description: "Short label used in filenames (e.g. 1k, 10k)."
        required: true
        type: string
      count:
        description: "Number of articles."
        required: true
        type: number
      lang:
        required: true
        type: string
      seed:
        required: true
        type: string
      include_fair_use:
        required: false
        type: boolean
        default: false
      cache_key:
        description: "Shared cache primary key (same across all sizes)."
        required: true
        type: string
      cache_restore_keys:
        description: "Newline-separated restore-keys fallback ladder."
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # We only cache the expensive-to-regenerate stuff:
      #   * .cache/*.sqlite      — pageviews, summaries, meta classifier
      #   * .cache/images/       — dithered JPEGs
      # Explicitly NOT cached: .cache/dumps/ (huge, and we use --source api
      # anyway), plus anything else that might land under .cache/ later.
      - name: Restore cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/*.sqlite
            .cache/images
          key: ${{ inputs.cache_key }}
          restore-keys: ${{ inputs.cache_restore_keys }}

      - name: Build text EPUB
        env:
          LANG_CODE: ${{ inputs.lang }}
          SEED: ${{ inputs.seed }}
        run: |
          mkdir -p out
          randompedia \
            --count ${{ inputs.count }} \
            --lang "$LANG_CODE" \
            --seed "$SEED" \
            --source api \
            --output "out/randompedia-${{ inputs.label }}-text.epub" \
            -v

      - name: Build images EPUB
        env:
          LANG_CODE: ${{ inputs.lang }}
          SEED: ${{ inputs.seed }}
        run: |
          # When --include-fair-use is on, tag the filename so the release
          # step can drop it before publishing — fair-use output must never
          # end up on a GitHub Release.
          suffix=""
          if [ "${{ inputs.include_fair_use }}" = "true" ]; then
            suffix="-fairuse"
          fi
          randompedia \
            --count ${{ inputs.count }} \
            --lang "$LANG_CODE" \
            --seed "$SEED" \
            --source api \
            --with-images \
            ${{ inputs.include_fair_use && '--include-fair-use' || '' }} \
            --output "out/randompedia-${{ inputs.label }}-images${suffix}.epub" \
            -v

      - name: Report cache footprint
        if: always()
        run: |
          if [ -d .cache ]; then
            echo "sqlite:"
            ls -lh .cache/*.sqlite 2>/dev/null || echo "  (none)"
            echo "images:"
            if [ -d .cache/images ]; then
              n=$(find .cache/images -type f | wc -l)
              sz=$(du -sh .cache/images | cut -f1)
              echo "  $n files, $sz"
            else
              echo "  (none)"
            fi
          fi

      # One artifact per EPUB. Uploading both text and images under a
      # single artifact name would collide (upload-artifact@v4+ treats
      # the name as the artifact identity, not a folder), so we split
      # them into two uploads. This also makes the run page show all
      # six EPUBs individually.
      #
      # archive: false disables the outer zip wrapper GitHub normally adds,
      # so the artifact downloads as the file itself. EPUBs are already zip
      # containers, so this gives users a working .epub directly instead of
      # a .zip they have to extract first. Requires exactly one file per
      # upload, and the 'name' input is ignored — the filename is used.
      - name: Upload text EPUB
        uses: actions/upload-artifact@v7
        with:
          path: out/randompedia-${{ inputs.label }}-text.epub
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload images EPUB
        uses: actions/upload-artifact@v7
        with:
          path: out/randompedia-${{ inputs.label }}-images${{ inputs.include_fair_use && '-fairuse' || '' }}.epub
          archive: false
          if-no-files-found: error
          retention-days: 30
