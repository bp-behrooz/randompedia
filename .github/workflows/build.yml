name: build-epubs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC on the 3rd of every month — pageviews for the previous
    # month are reliably published by then.
    - cron: "17 3 3 * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Shuffle seed"
        required: false
        default: "randompedia-v1"
      lang:
        description: "Wikipedia language edition"
        required: false
        default: "en"
      include_fair_use:
        description: "Include fair-use images (personal builds only; not redistributable)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write  # for creating releases

concurrency:
  group: build-epubs
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev]'
      - run: pytest

  # The build jobs form three chains, one per article count:
  #     test -> build-1k-text  -> build-1k-images  -\
  #     test -> build-5k-text  -> build-5k-images  -+-> release
  #     test -> build-10k-text -> build-10k-images -/
  # Each chain hits Wikimedia's API on the text pass and reuses the warmed
  # SQLite summaries cache on the images pass, so the images jobs finish
  # in a fraction of the time. The three chains run in parallel with each
  # other; all stay under Wikimedia's per-IP rate limit thanks to the
  # 3 req/s per-fetcher throttle and Retry-After handling.
  #
  # Cache prefix reuse across chains is also intentional: 5k's summaries
  # are a subset of 10k's, so a second dispatch (with 10k's cache warm)
  # makes 5k's text pass a hit-only walk instead of live API traffic.
  #
  # Trigger policy on the `if:` of every build entry point:
  #
  #   * schedule -> only on the canonical repo (everplays/randompedia).
  #     Forks that just sit there never hit Wikimedia on their own; the
  #     fork owner has to explicitly dispatch to opt in.
  #
  #   * workflow_dispatch -> anywhere. This is how someone with a fork
  #     produces their own personal build (e.g. an --include-fair-use
  #     variant, or a different --seed / --lang).

  build-1k-text:
    needs: test
    if: >-
      (github.event_name == 'schedule' && github.repository == 'everplays/randompedia')
      || github.event_name == 'workflow_dispatch'
    name: build 1k text
    uses: ./.github/workflows/_build-epub.yml
    with:
      label: 1k
      count: 1000
      variant: text
      with_images: false
      lang: ${{ inputs.lang || 'en' }}
      seed: ${{ inputs.seed || 'randompedia-v1' }}
      include_fair_use: ${{ inputs.include_fair_use || false }}

  build-1k-images:
    needs: build-1k-text
    name: build 1k images
    uses: ./.github/workflows/_build-epub.yml
    with:
      label: 1k
      count: 1000
      variant: images
      with_images: true
      lang: ${{ inputs.lang || 'en' }}
      seed: ${{ inputs.seed || 'randompedia-v1' }}
      include_fair_use: ${{ inputs.include_fair_use || false }}

  build-5k-text:
    needs: test
    if: >-
      (github.event_name == 'schedule' && github.repository == 'everplays/randompedia')
      || github.event_name == 'workflow_dispatch'
    name: build 5k text
    uses: ./.github/workflows/_build-epub.yml
    with:
      label: 5k
      count: 5000
      variant: text
      with_images: false
      lang: ${{ inputs.lang || 'en' }}
      seed: ${{ inputs.seed || 'randompedia-v1' }}
      include_fair_use: ${{ inputs.include_fair_use || false }}

  build-5k-images:
    needs: build-5k-text
    name: build 5k images
    uses: ./.github/workflows/_build-epub.yml
    with:
      label: 5k
      count: 5000
      variant: images
      with_images: true
      lang: ${{ inputs.lang || 'en' }}
      seed: ${{ inputs.seed || 'randompedia-v1' }}
      include_fair_use: ${{ inputs.include_fair_use || false }}

  build-10k-text:
    needs: test
    if: >-
      (github.event_name == 'schedule' && github.repository == 'everplays/randompedia')
      || github.event_name == 'workflow_dispatch'
    name: build 10k text
    uses: ./.github/workflows/_build-epub.yml
    with:
      label: 10k
      count: 10000
      variant: text
      with_images: false
      lang: ${{ inputs.lang || 'en' }}
      seed: ${{ inputs.seed || 'randompedia-v1' }}
      include_fair_use: ${{ inputs.include_fair_use || false }}

  build-10k-images:
    needs: build-10k-text
    name: build 10k images
    uses: ./.github/workflows/_build-epub.yml
    with:
      label: 10k
      count: 10000
      variant: images
      with_images: true
      lang: ${{ inputs.lang || 'en' }}
      seed: ${{ inputs.seed || 'randompedia-v1' }}
      include_fair_use: ${{ inputs.include_fair_use || false }}

  release:
    needs: [build-1k-text, build-1k-images, build-5k-text, build-5k-images, build-10k-text, build-10k-images]
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: echo "tag=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Filter out fair-use variants, then verify the four expected EPUBs
        run: |
          set -eu
          shopt -s nullglob

          # Fair-use EPUBs are personal-use only and must never end up on
          # a GitHub Release — not on the canonical repo, not on a fork.
          # The workflow-run artifact still contains them (30-day
          # retention, download from the run page), which is the right
          # scope for personal builds. Delete them before the release
          # step's glob picks them up.
          rm -f out/*-fairuse.epub

          files=(out/*.epub)
          if [ ${#files[@]} -ne 6 ]; then
            echo "expected 6 releasable EPUBs, got ${#files[@]}:" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          printf 'releasing: %s\n' "${files[@]}"

      - name: Create or update GitHub Release and upload EPUBs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          NOTES=$(cat <<'EOF'
          Monthly build of randompedia EPUBs.

          - `randompedia-1k-text.epub` — top 1k articles, text only
          - `randompedia-1k-images.epub` — top 1k articles, with dithered lead images
          - `randompedia-5k-text.epub` — top 5k articles, text only
          - `randompedia-5k-images.epub` — top 5k articles, with dithered lead images
          - `randompedia-10k-text.epub` — top 10k articles, text only
          - `randompedia-10k-images.epub` — top 10k articles, with dithered lead images

          **Attribution.** Article text and images are the work of
          Wikipedia contributors. Each entry in the book links back to
          its source article. Only images hosted on Wikimedia Commons
          are included; non-free / fair-use images from individual
          Wikipedia projects are excluded so the book can be freely
          redistributed.

          **License.** Article content © Wikipedia contributors, licensed
          [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
          and GFDL. This compilation, as a derivative work, is likewise
          released under CC BY-SA 4.0.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — updating notes and re-uploading assets"
            gh release edit "$TAG" \
              --title "randompedia $TAG" \
              --notes "$NOTES"
            # --clobber replaces any asset with the same name, so re-runs work.
            gh release upload "$TAG" out/*.epub --clobber
          else
            echo "creating release $TAG"
            gh release create "$TAG" out/*.epub \
              --title "randompedia $TAG" \
              --notes "$NOTES"
          fi
